[workspace]
resolver = "3"
members = ["crates/*", "spikes/animation"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/ItsOverk1ll/Hyprwin"

[workspace.dependencies]
hyprwin-anim = { path = "crates/hyprwin-anim" }
hyprwin-config = { path = "crates/hyprwin-config" }
hyprwin-ipc = { path = "crates/hyprwin-ipc" }
hyprwin-layout = { path = "crates/hyprwin-layout" }
hyprwin-win32 = { path = "crates/hyprwin-win32" }

windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Power",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
