[workspace]
resolver = "3"
members = ["crates/*", "spikes/animation"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/hyprwin/hyprwin"

[workspace.dependencies]
hyprwin-anim = { path = "crates/hyprwin-anim" }
hyprwin-config = { path = "crates/hyprwin-config" }
hyprwin-layout = { path = "crates/hyprwin-layout" }
hyprwin-win32 = { path = "crates/hyprwin-win32" }

windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
