[package]
name = "hyprwin-settings"
description = "hyprwin Settings, Themes and App Groups window (runs only while open)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hyprwin-config.workspace = true
hyprwin-ipc.workspace = true
hyprwin-layout.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde_json = "1.0"

[build-dependencies]
embed-resource = "3.0"
embed-manifest = "1.4"
