# Publishes a release when a version tag is pushed:
#   (bump `version` in Cargo.toml, commit)  git tag v0.3.0 && git push origin v0.3.0
# Builds the single-file installer and the zip with scripts/package.ps1 and
# attaches both. A tag with a suffix (v0.4.0-beta.1) is published as a
# pre-release, which the stable app's update check ignores. Notes come from
# .github/release-notes/<tag>.md when it exists. If a release for the tag
# already exists, the files are (re)uploaded to it.
# The Settings Feedback tab sends to the Discord webhook in the
# HYPRWIN_FEEDBACK_WEBHOOK repository secret (optional).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v0.3.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match Cargo.toml version $v. Bump the version first." }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Unit tests
        run: cargo test --workspace
      - name: Build installer and zip
        shell: pwsh
        env:
          HYPRWIN_FEEDBACK_WEBHOOK: ${{ secrets.HYPRWIN_FEEDBACK_WEBHOOK }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package.ps1
      - name: Publish release
        shell: pwsh
        run: |
          $files = "dist\hyprwin-$env:VERSION-setup.exe", "dist\hyprwin-$env:VERSION-windows-x64.zip"
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "missing $f" } }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            $beta = $env:VERSION -match '-'
            $opts = @('--title', $(if ($beta) { "hyprwin $env:VERSION (beta, test version)" } else { "hyprwin $env:VERSION" }))
            $notes = ".github\release-notes\$env:TAG.md"
            if (Test-Path $notes) { $opts += @('--notes-file', $notes) } else { $opts += '--generate-notes' }
            if ($beta) { $opts += '--prerelease' }
            gh release create $env:TAG @files @opts
          }
